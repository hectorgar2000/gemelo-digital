name: Evaluación diaria del modelo

on:
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC — después del forecast (05:30 UTC)
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet "supabase>=2,<3" python-dotenv numpy

      - name: Evaluar MAPE del forecast de ayer
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cloud_model_eval.py --hours 24
        # Sale con exit 1 si MAPE > 10% → notificación GitHub al propietario
