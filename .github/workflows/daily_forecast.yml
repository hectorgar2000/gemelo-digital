name: Predicción diaria (Prophet 24h)

on:
  schedule:
    - cron: '30 5 * * *'   # cada día a las 05:30 UTC (07:30 hora española)
  workflow_dispatch:        # ejecución manual desde GitHub Actions

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --quiet \
            httpx \
            "supabase>=2" \
            python-dotenv \
            pandas \
            numpy \
            prophet \
            pystan

      - name: Generar predicción y guardar en Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cloud_forecast.py --hours 36
