name: Predicción diaria (Prophet 24h)

on:
  schedule:
    - cron: '30 5 * * *'   # cada día a las 05:30 UTC (07:30 hora española)
  workflow_dispatch:        # ejecución manual desde GitHub Actions

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        # prophet se necesita para cargar el .pkl y ejecutar predict().
        # pystan NO es necesario: es el backend antiguo (prophet>=1.0 usa cmdstanpy).
        # cmdstan tampoco hace falta: predict() no llama a Stan, solo usa los
        # parámetros ya ajustados que están serializados en prophet_model.pkl.
        # IMPORTANTE: pinear prophet a la misma versión con que se generó el pkl.
        # Un cambio de versión incompatible puede corromper la deserialización.
        run: pip install --quiet httpx "supabase>=2,<3" python-dotenv pandas numpy "prophet==1.3.0"

      - name: Generar predicción y guardar en Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cloud_forecast.py --hours 36
