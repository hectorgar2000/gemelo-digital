name: Recolección de datos (cada hora)

on:
  schedule:
    # GitHub retrasa o descarta crons del plan gratuito en horas de carga
    # (se han visto huecos de 4-8h). Dos disparos por hora en minutos poco
    # concurridos aumentan la probabilidad de que al menos uno se ejecute.
    # El colector es idempotente (watermark + upsert), así que ejecutar de más
    # no duplica datos.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:        # ejecución manual desde GitHub Actions

concurrency:
  group: hourly-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet httpx "supabase>=2,<3" python-dotenv

      - name: Recoger y guardar datos en Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cloud_collector.py
