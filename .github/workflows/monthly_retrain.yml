name: Reentrenamiento mensual de Prophet

on:
  schedule:
    - cron: '0 3 1 * *'    # el día 1 de cada mes a las 03:00 UTC
  workflow_dispatch:        # también se puede lanzar manualmente

permissions:
  contents: write           # necesario para hacer git push del nuevo .pkl

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45     # el entrenamiento con 12 meses tarda ~15-20 min

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # necesario para poder hacer push después

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --quiet \
            "supabase>=2,<3" \
            python-dotenv \
            pandas \
            numpy \
            "prophet==1.3.0" \
            cmdstanpy

      # Cachear CmdStan keyed por versión de cmdstanpy para evitar re-descargas (~300 MB).
      # La versión se obtiene después de instalar cmdstanpy, antes de usarla.
      - name: Obtener versión de cmdstanpy para clave de caché
        id: cmdstanpy_version
        run: echo "version=$(python -c 'import cmdstanpy; print(cmdstanpy.__version__)')" >> $GITHUB_OUTPUT

      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ steps.cmdstanpy_version.outputs.version }}

      - name: Instalar CmdStan (necesario para fit())
        run: python -c "import cmdstanpy; cmdstanpy.install_cmdstan()" 2>/dev/null || true

      - name: Reentrenar modelo con los últimos 12 meses
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cloud_retrain.py --months 12

      - name: Commitear nuevo modelo al repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prediction/prophet_model.pkl
          git diff --cached --stat
          git commit -m "chore: retrain Prophet $(date -u +%Y-%m-%d)" || echo "Sin cambios en el modelo"
          git pull --rebase origin main
          git push
